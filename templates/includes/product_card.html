<article class="product-card">
  <a href="{{ product.get_absolute_url }}" class="product-media">
    {% if product.main_image %}
      <img src="{{ product.main_image.url }}" alt="{{ product.name }}">
    {% else %}
      <span>Sin imagen</span>
    {% endif %}
  </a>
  <div class="product-body">
    <p class="product-category">{{ product.category.name }}</p>
    <h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    {% if product.short_description %}<p>{{ product.short_description }}</p>{% endif %}
    <strong>{{ store_settings.currency }} {{ product.price }}</strong>
    <form method="post" action="{% url 'cart:add' product.id %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="button" type="submit">Agregar</button>
    </form>
  </div>
</article>

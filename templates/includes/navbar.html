<header class="site-header">
  <a class="brand" href="{% url 'storefront:home' %}">
    {% if store_settings.logo %}
      <img src="{{ store_settings.logo.url }}" alt="{{ store_settings.store_name }}">
    {% endif %}
    <span>{{ store_settings.store_name }}</span>
  </a>
  <nav class="site-nav">
    <a href="{% url 'catalog:product_list' %}">Productos</a>
    <a href="{% url 'storefront:contact' %}">Contacto</a>
    <a href="{% url 'cart:detail' %}">Carrito ({{ cart_item_count }})</a>
    {% if user.is_authenticated %}
      <a href="{% url 'customers:profile' %}">Mi cuenta</a>
    {% else %}
      <a href="{% url 'customers:login' %}">Ingresar</a>
    {% endif %}
  </nav>
</header>
